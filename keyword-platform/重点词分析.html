<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>搜索重点词库</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surface:#fff;--subtle:#f7f8fa;--border:#e9ebef;--border2:#e0e3e8;
  --text:#1d2129;--text2:#4e5969;--muted:#86909c;--muted2:#a8b0bd;
  --primary:#3a6ff7;--primary-soft:#eaf0ff;
  --red:#f5222d;--green:#00b42a;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo','Consolas','Roboto Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;padding-bottom:60px}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:200}
.logo{font-size:16px;font-weight:700;color:var(--text)}.logo span{color:var(--primary)}
.badge{background:var(--primary-soft);color:var(--primary);font-size:11px;padding:2px 9px;border-radius:4px;margin-left:10px;font-weight:500}
.hdr-right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.cwsel{display:flex;align-items:center;gap:8px}
.cwsel label{font-size:12px;color:var(--text2);font-weight:600}
.cwsel input[type=date]{font-family:var(--mono);font-size:12px;border:1px solid var(--border2);border-radius:5px;padding:5px 9px;background:var(--surface);color:var(--text);cursor:pointer;outline:none}
.cwsel input[type=date]:hover,.cwsel input[type=date]:focus{border-color:var(--primary)}
.cwwin{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:96px}
.cwbtn{border:1px solid var(--border2);background:var(--surface);border-radius:5px;width:26px;height:26px;cursor:pointer;color:var(--text2);font-size:13px}
.cwbtn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.cwbtn:disabled{opacity:.4;cursor:not-allowed}
.main{padding:20px clamp(16px,3vw,56px);max-width:2400px;margin:0 auto}
.layout{display:flex;gap:18px;align-items:flex-start}
.panel{flex:0 0 300px;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);position:sticky;top:74px;transition:margin-left .26s ease,opacity .2s ease}
.content{flex:1 1 auto;min-width:0}
@media(max-width:760px){.panel{flex-basis:84vw;width:84vw}}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.panel-h .rst{font-size:11px;color:var(--primary);cursor:pointer;font-weight:500}
.panel-b{padding:6px 16px 14px;max-height:calc(100vh - 160px);overflow:auto}
.layout.collapsed .panel{margin-left:-318px;opacity:0;pointer-events:none}
.drawerTab{position:fixed;left:0;top:50%;transform:translateY(-50%);width:22px;height:62px;background:var(--surface);border:1px solid var(--border2);border-left:none;border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:600;color:var(--text2);font-size:15px;box-shadow:2px 0 8px rgba(0,0,0,.10);transition:color .15s,border-color .15s}
.drawerTab:hover{color:var(--primary);border-color:var(--primary)}
.drawerTab .lbl{position:absolute;left:26px;white-space:nowrap;font-size:11px;background:var(--surface);border:1px solid var(--border2);border-radius:5px;padding:3px 8px;color:var(--text2);opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.drawerTab:hover .lbl{opacity:1}
.cat-block{padding:12px 0;border-bottom:1px dashed var(--border)}
.cat-block:last-child{border-bottom:none}
.cat-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin-bottom:10px}
.cat-title .dot{width:9px;height:9px;border-radius:50%}
.cat-title .c{margin-left:auto;font-size:11px;color:var(--text2);background:var(--subtle);border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-family:var(--mono)}
.ctl{margin-bottom:9px}
.ctl-lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text2);margin-bottom:3px}
.ctl-lbl .v{font-family:var(--mono);color:var(--primary);font-weight:600}
.ctl input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:var(--border2);border-radius:2px;outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rec{font-size:10.5px;color:var(--muted);margin-top:4px;cursor:pointer;line-height:1.45}
.rec:hover{color:var(--primary)}
.rec:hover b{text-decoration:underline}
.rec b{color:var(--primary);font-family:var(--mono);font-weight:600}
.mod-tag{display:none;font-size:9px;background:#fff4e8;color:#d4690a;border:1px solid #ffd8a8;border-radius:3px;padding:0 4px;margin-left:4px;font-family:var(--font);font-weight:500;vertical-align:middle}
.ctl.modified .mod-tag{display:inline}
.ctl.modified input[type=range]{background:#ffe7cc}
.ctl.modified input[type=range]::-webkit-slider-thumb{background:#ff8b3d}
.ctl.modified .ctl-lbl .v{color:#d4690a}
.ctl.modified .rec{color:#d4690a}
.ctl.modified .rec b{color:#d4690a}
.ctl.modified .rec:hover{color:#b35a00}
.hb{cursor:crosshair}
#tip{position:fixed;z-index:500;background:#1d2129;color:#fff;font-size:11px;font-family:var(--mono);padding:4px 9px;border-radius:5px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.28);opacity:0;transition:opacity .08s;transform:translate(-50%,-150%)}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
@media(max-width:1280px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;border-left:3px solid var(--c)}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.card.active{background:var(--cs);box-shadow:0 0 0 2px var(--c) inset}
.card-n{font-size:12px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:6px}
.card-n .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.card-v{font-size:26px;font-weight:700;font-family:var(--mono);margin-top:6px;line-height:1}
.card-u{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:160px;border:1px solid var(--border2);border-radius:6px;padding:7px 11px;font-size:13px;font-family:var(--font);outline:none}
.search:focus{border-color:var(--primary)}
.divs{display:flex;gap:2px;background:var(--subtle);border:1px solid var(--border);border-radius:6px;padding:3px;flex-wrap:wrap}
.dbtn{padding:4px 10px;border-radius:4px;border:none;background:none;color:var(--text2);cursor:pointer;font-size:11.5px;font-family:var(--font)}
.dbtn.on{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pfsel{display:flex;gap:2px;background:var(--subtle);border:1px solid var(--border2);border-radius:6px;padding:3px}
.pfbtn{padding:4px 12px;border-radius:4px;border:none;background:none;color:var(--text2);cursor:pointer;font-size:12px;font-family:var(--font);font-weight:500}
.pfbtn.on{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gpanel{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.ghdr{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-left:3px solid var(--c)}
.ghdr .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.gname{font-size:14px;font-weight:600}
.gcnt{font-size:11px;color:var(--text2);background:var(--subtle);padding:2px 8px;border-radius:10px;border:1px solid var(--border);font-family:var(--mono)}
.gdesc{font-size:11.5px;color:var(--muted);margin-left:2px;flex:1}
.glim{font-size:11px;color:#d4690a;background:#fff4e8;border:1px solid #ffd8a8;border-radius:4px;padding:1px 7px}
.gexp{flex:none;font-size:11px;color:var(--primary);background:var(--primary-soft);border:1px solid transparent;border-radius:4px;padding:2px 10px;font-weight:500;cursor:pointer}
.gexp:hover{border-color:var(--primary)}
.gcaret{color:var(--muted2);font-size:11px;transition:.2s}
.gpanel.collapsed .gbody{display:none}
.gpanel.collapsed .gcaret{transform:rotate(-90deg)}
.gbody{border-top:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;padding:8px 14px;font-size:11px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
th.spark,td.spark{text-align:center}
th:hover{color:var(--primary)}
td{padding:7px 14px;text-align:right;border-bottom:1px solid var(--subtle);font-family:var(--mono);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--subtle)}
.kw{font-family:var(--font);font-weight:600;color:var(--text)}
.kdiv{font-family:var(--font);font-size:10.5px;color:var(--muted);background:var(--subtle);border:1px solid var(--border);border-radius:3px;padding:1px 5px;margin-left:6px}
.rk{font-weight:700;color:var(--primary)}
.up{color:var(--green)}.dn{color:var(--red)}.fl{color:var(--muted)}
.helper{color:var(--muted2);font-size:11px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:9px 14px;border-top:1px solid var(--subtle);font-size:12px;color:var(--text2)}
.pager .pinfo{font-family:var(--mono);color:var(--muted)}
.pbtn{border:1px solid var(--border2);background:var(--surface);border-radius:5px;min-width:26px;height:26px;padding:0 7px;cursor:pointer;color:var(--text2);font-size:12px}
.pbtn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:11px;color:var(--muted);margin:0 0 16px;line-height:1.6}
.note b{color:var(--text2)}
</style>
</head>
<body>
<div id="tip"></div>
<div class="hdr">
  <div><span class="logo">搜索重点词库</span><span class="badge" id="badge"></span></div>
  <div class="hdr-right">
    <div class="pfsel" id="pfSel"></div>
    <div class="cwsel">
      <label>截止日期</label>
      <button class="cwbtn" id="cwPrev">‹</button>
      <input type="date" id="dateSel">
      <button class="cwbtn" id="cwNext">›</button>
      <span class="cwwin" id="cwWin"></span>
    </div>
  </div>
</div>
<div class="main">
  <p class="note">数据共 <b id="noteRange"></b>。选择<b>截止日期</b>，当前窗口=截止日往前 7 天；环比为再往前 7 天；12周/4周/过去30天等窗口均从截止日按天滑动。<b>增长四类（TOP&gt;长期&gt;短期&gt;发现新词）按优先级互斥</b>；<b>衰减、无结果</b>为并行独立标签。"日均"=窗口内指标 ÷ 天数（缺失日记 0）；日均GMV=当前 7 天GMV ÷ 7。</p>
  <button class="drawerTab" id="ctlToggle" title="展开/收起阈值参数"><span class="arr"></span><span class="lbl"></span></button>
  <div class="layout" id="layout">
    <div class="panel">
      <div class="panel-h">阈值参数 <span class="rst" id="resetBtn">恢复默认</span></div>
      <div class="panel-b" id="ctlBox"></div>
    </div>
    <div class="content">
      <div class="cards" id="cards"></div>
      <div class="toolbar">
        <input class="search" id="search" placeholder="搜索关键词…">
        <div class="divs" id="divs"></div>
      </div>
      <div id="groups"></div>
    </div>
  </div>
</div>
<script src="重点词_分析数据.js"></script>
<script>
var DB=window.__KW_DATA__;
var KW=DB.kw, META=DB.meta, NDAYS=META.days;
// 双端平台：每个词存 mp(小程序)/app(APP) 原始数组；合计=两端逐日相加（前端算）
var PLATS=META.platforms||['小程序'];
var CUR_PLAT=PLATS.indexOf('合计')>=0?'合计':PLATS[0];
function zeros(){return new Array(NDAYS).fill(0);}
// 按所选平台，把 k.u/c/r/g/p 指向对应数组；metrics()/classify() 不变，照常读这些字段
function applyPlatform(plat){
  CUR_PLAT=plat;
  var FS=['u','c','r','g','p'];
  KW.forEach(function(k){
    var src;
    if(plat==='小程序') src=k.mp;
    else if(plat==='APP') src=k.app;
    else { // 合计
      src={}; FS.forEach(function(f){
        var a=k.mp&&k.mp[f], b=k.app&&k.app[f], o=new Array(NDAYS), i;
        for(i=0;i<NDAYS;i++) o[i]=(a?a[i]:0)+(b?b[i]:0);
        src[f]=o;
      });
    }
    if(!src) src={u:zeros(),c:zeros(),r:zeros(),g:zeros(),p:zeros()};
    k.u=src.u;k.c=src.c;k.r=src.r;k.g=src.g;k.p=src.p;
  });
}
function setPlatform(plat){
  applyPlatform(plat);
  document.querySelectorAll('.pfbtn').forEach(function(x){x.classList.toggle('on',x.dataset.pf===plat)});
  resetPages(); recompute(); render();
}
var START=new Date(META.start+'T00:00:00');
var A=NDAYS-1, PAGE=10;   // anchor = end-date day index (inclusive)
function idxDate(i){var d=new Date(START);d.setDate(d.getDate()+i);return d;}
function fmtISO(d){var m=d.getMonth()+1,da=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(da<10?'0':'')+da;}
function fmtMD(i){var d=idxDate(i);var m=d.getMonth()+1,da=d.getDate();return (m<10?'0':'')+m+'/'+(da<10?'0':'')+da;}
function isoIdx(iso){return Math.round((new Date(iso+'T00:00:00')-START)/86400000);}

// 统一前三列：日均搜索人数 → 平均支付率 → 日均GMV，其后为各类观测指标
var BASECOLS=[['cur','日均搜索人数'],['pr','平均支付率'],['gmv','日均GMV']];
var CATS=[
 {k:'TOP',c:'#f5222d',cs:'#fef0f0',desc:'当前窗口日均搜索人数高于阈值的头部词',
  cols:BASECOLS.concat([['rank','平台排名']]),
  p:[['top','当前7天日均 >','人',200,3000,50,1000]]},
 {k:'长期增长',c:'#00b42a',cs:'#eafff0',desc:'持续多周环比为正且 N 周累计增长达标（回看周期可调）',
  cols:BASECOLS.concat([['cum12','N周累计增长率'],['pos','环比正周']]),
  p:[['lg_weeks','回看周期 N','周',4,24,1,12],['lg_pos','环比为正周数 ≥','/11周',1,23,1,6],['lg_cum','N周累计增长率 ≥','%',0,500,10,100],['lg_cur','当前7天日均 ≥','人',0,800,10,300]]},
 {k:'短期飙升',c:'#ff8b3d',cs:'#fff5ec',desc:'近一周环比快速增长的词',
  cols:BASECOLS.concat([['wow','周环比']]),
  p:[['sg_wow','周环比 ≥','%',0,100,5,20],['sg_cur','当前7天日均 ≥','人',0,1000,20,300]]},
 {k:'发现新词',c:'#9d7bf0',cs:'#f5f1ff',desc:'当前周起量但过去 30 天几乎无搜索',
  cols:BASECOLS.concat([['base','过去30天日均']]),
  p:[['nw_cur','当前7天日均 ≥','人',0,400,10,50],['nw_base','过去30天日均 <','人',0,50,1,10]]},
 {k:'衰减',c:'#86909c',cs:'#f3f5f7',desc:'起始量足够且近 4 周持续下滑（并行标签）',
  cols:BASECOLS.concat([['cum4','4周累计增长率'],['startW','起始周日均'],['neg','环比负周']]),
  p:[['dc_start','起始周日均 ≥','人',0,800,10,300],['dc_neg','环比为负周数 ≥','/4周',1,4,1,4],['dc_drop','4周累计跌幅 ≥','%',0,80,5,20]]},
 {k:'无结果',c:'#f5576c',cs:'#fef0f2',desc:'当前窗口搜索无结果率偏高（并行标签）',
  cols:BASECOLS.concat([['nrr','无结果率']]),
  p:[['nr_rate','无结果率 ≥','%',10,100,5,50]]},
];
var T={}; CATS.forEach(function(c){c.p.forEach(function(p){T[p[0]]=p[6]})});
var DEF=JSON.parse(JSON.stringify(T));
// 各阈值的推荐值(=DEF)与业务理由，渲染在滑杆下方，点击可一键套用
var REC={
  top:'头部词，主力流量',
  lg_weeks:'过滤短期波动',
  lg_pos:'趋势稳定上行',
  lg_cum:'累计增长显著',
  lg_cur:'有体量才有价值',
  sg_wow:'一周内明显加速',
  sg_cur:'过滤小词噪声',
  nw_cur:'当前已起量',
  nw_base:'此前几乎无搜索',
  dc_start:'曾有体量才谈衰减',
  dc_neg:'趋势性下行',
  dc_drop:'累计跌幅显著',
  nr_rate:'供给缺口明确'
};

function metrics(k,A){
  var u=k.u, W=[], w, d, s, hi, lo;
  for(w=0;;w++){ hi=A-7*w; lo=hi-6; if(lo<0) break; s=0;for(d=lo;d<=hi;d++)s+=u[d];W[w]=s; } // 全部可得的 7 天窗口
  var cur=W[0]!=null?W[0]/7:0, prev=W[1]!=null?W[1]/7:null, b;
  var wow=prev>0?(cur/prev-1)*100:(prev===0?(cur>0?Infinity:0):null);
  var cum4=null,neg=null,startW=null;
  if(W[4]!=null){ b=W[3]; cum4=b>0?(W[0]-b)/b*100:(W[0]>0?Infinity:0); startW=W[3]/7; neg=0; for(w=0;w<4;w++) if(W[w]<W[w+1]) neg++; }
  var base=null; if(A-36>=0){ s=0; for(d=A-36;d<=A-7;d++) s+=u[d]; base=s/30; }
  var sc=0,sr=0,sg=0,sp=0,su=0; for(d=Math.max(0,A-6);d<=A;d++){ sc+=k.c[d]; sr+=k.r[d]; sg+=k.g[d]; sp+=(k.p?k.p[d]:0); su+=k.u[d]; }
  var nrr=sc>0?sr/sc*100:0;
  var pr=su>0?sp/su*100:0;
  return {W:W,cur:cur,prev:prev,wow:wow,cum12:null,pos:null,cum4:cum4,neg:neg,startW:startW,base:base,nrr:nrr,pr:pr,wuv:W[0]||0,gmv:sg/7};
}
// 长期增长依赖可调"回看周期"N（周），每次分类按当前 N 从 W[] 现算累计增长率与环比正周数
function deriveLong(m){
  var N=T.lg_weeks, W=m.W, b;
  if(W[N-1]!=null){ b=W[N-1]; m.cum12=b>0?(W[0]-b)/b*100:(W[0]>0?Infinity:0); m.pos=0; for(var w=0;w<N-1;w++) if(W[w]>W[w+1]) m.pos++; }
  else { m.cum12=null; m.pos=null; }
}
function classify(k){
  var m=k._m;
  deriveLong(m);
  var top=m.cur>T.top;
  var lg=m.cum12!=null && m.pos>=T.lg_pos && m.cum12>=T.lg_cum && m.cur>=T.lg_cur;
  var sg=m.wow!=null && m.wow>=T.sg_wow && m.cur>=T.sg_cur;
  var nw=m.base!=null && m.cur>=T.nw_cur && m.base<T.nw_base;
  var primary=top?'TOP':lg?'长期增长':sg?'短期飙升':nw?'发现新词':null;
  var decay=m.startW!=null && m.startW>=T.dc_start && m.neg>=T.dc_neg && m.cum4<=-T.dc_drop;

function fmtNum(n){ if(n===Infinity)return '∞'; if(n>=10000)return (n/10000).toFixed(1)+'w'; return Math.round(n).toLocaleString(); }
function pct(v){ if(v==null)return '<span class="helper">—</span>'; if(v===Infinity)return '<span class="up">∞</span>'; var cls=v>0?'up':v<0?'dn':'fl'; return '<span class="'+cls+'">'+(v>0?'+':'')+v.toFixed(1)+'%</span>'; }

function sortVal(col,k){var m=k._m;var v={cur:m.cur,pr:m.pr,rank:-(RANK[k.n]||9999),gmv:m.gmv,cum12:m.cum12,cum4:-m.cum4,wow:m.wow,pos:m.pos,neg:m.neg,startW:m.startW,base:m.base,nrr:m.nrr}[col];return v==null?-1e9:v;}
function spark(k){
  // 周日均：仅取最近 12 周（每点=该周日均，最右点=当前 7 天日均），逐点标记，高亮波峰/波谷
  var Wk=k._m.W, s=[], i;
  for(i=Wk.length-1;i>=0;i--) s.push(Wk[i]/7);
  s=s.slice(-12); // 仅近 12 周
  var nReal=s.length, plot=nReal>=2?s:[s[0]||0,s[0]||0], n=plot.length;
  var mn=Math.min.apply(null,plot),mx=Math.max.apply(null,plot),rng=mx-mn||1,W=160,H=30,pad=5;
  var X=function(i){return n>1?pad+i*(W-2*pad)/(n-1):W/2;};
  var Y=function(v){return H-pad-(v-mn)/rng*(H-2*pad);};
  var pts=plot.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);});
  // 波峰/波谷索引
  var maxI=0,minI=0; for(i=1;i<plot.length;i++){ if(plot[i]>plot[maxI])maxI=i; if(plot[i]<plot[minI])minI=i; }
  var dots='';
  for(i=0;i<n;i++){
    var cx=X(i).toFixed(1), cy=Y(plot[i]).toFixed(1);
    if(i===maxI)     dots+='<circle cx="'+cx+'" cy="'+cy+'" r="2.6" fill="#00b42a"/>';       // 波峰
    else if(i===minI)dots+='<circle cx="'+cx+'" cy="'+cy+'" r="2.6" fill="#f5222d"/>';       // 波谷
    else if(i===n-1) continue;                                                                // 当前周非峰谷不标记
    else             dots+='<circle cx="'+cx+'" cy="'+cy+'" r="1.5" fill="#fff" stroke="#b6bcc6" stroke-width="1"/>';
  }
  // 每周一个透明 hit 区，自定义浮层提示"日期区间 + 当周日均"
  var band=nReal>=2?(W-2*pad)/(nReal-1):W, rects='';
  for(i=0;i<nReal;i++){
    var xi=X(i);
    var wkIdx=nReal-1-i, endD=A-7*wkIdx, startD=endD-6;
    var t=fmtMD(startD)+'~'+fmtMD(endD)+' 周日均 '+Math.round(s[i]).toLocaleString()+' 人';
    rects+='<rect class="hb" data-t="'+t+'" x="'+(xi-band/2).toFixed(1)+'" y="0" width="'+band.toFixed(1)+'" height="'+H+'" fill="transparent" pointer-events="all"></rect>';
  }
  return '<svg width="'+W+'" height="'+H+'" style="cursor:default"><polyline fill="none" stroke="#c9ced6" stroke-width="1.1" points="'+pts.join(' ')+'"/>'+dots+rects+'</svg>';
}

/*XLSX_CORE_BEGIN*/
var CRC_TBL=(function(){var t=[],c,i,j;for(i=0;i<256;i++){c=i;for(j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF,i;for(i=0;i<b.length;i++)c=CRC_TBL[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function utf8(s){return new TextEncoder().encode(s);}
// files: [{name, xml}] → 存储式(无压缩) zip 字节
function zipStore(files){
  var chunks=[],cd=[],off=0;
  function u16(v){return [v&255,(v>>8)&255];}
  function u32(v){return [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];}
  files.forEach(function(f){
    var name=utf8(f.name),data=utf8(f.xml),crc=crc32(data);
    var hdr=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    chunks.push(new Uint8Array(hdr),name,data);
    cd.push([[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off)),name]);
    off+=hdr.length+name.length+data.length;
  });
  var cdStart=off,cdLen=0;
  cd.forEach(function(e){var h=new Uint8Array(e[0]);chunks.push(h,e[1]);cdLen+=h.length+e[1].length;});
  chunks.push(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdLen),u32(cdStart),u16(0))));
  var total=0;chunks.forEach(function(c){total+=c.length});
  var out=new Uint8Array(total),p=0;chunks.forEach(function(c){out.set(c,p);p+=c.length;});
  return out;
}
// rows: 每行为单元格数组，单元格 {t:'s'|'n'|'p', v}（p=百分比数值，套 0.0% 样式）
function buildXlsxBytes(sheetName,rows){
  var COLS='ABCDEFGH';

    return '<row r="'+(ri+1)+'">'+r.map(function(c,ci){
      var ref=COLS[ci]+(ri+1);
      if(c.t==='s')return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(c.v)+'</t></is></c>';
      if(c.t==='p')return '<c r="'+ref+'" s="1"><v>'+c.v+'</v></c>';
      return '<c r="'+ref+'"><v>'+c.v+'</v></c>';
    }).join('')+'</row>';
  }).join('');
  var M='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  var sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="'+M+'"><cols><col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="24" customWidth="1"/><col min="3" max="5" width="14" customWidth="1"/></cols><sheetData>'+sd+'</sheetData></worksheet>';
  var styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="'+M+'"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.0%"/></numFmts><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="'+M+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEsc(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
  var wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  var rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  return zipStore([
    {name:'[Content_Types].xml',xml:ct},
    {name:'_rels/.rels',xml:rootRels},
    {name:'xl/workbook.xml',xml:wb},
    {name:'xl/_rels/workbook.xml.rels',xml:wbRels},
    {name:'xl/styles.xml',xml:styles},
    {name:'xl/worksheets/sheet1.xml',xml:sheet},
  ]);
}

// 导出某词库：当前平台/截止日/搜索/Division 过滤后的全部词（跨分页），按当前排序
function exportCat(catK){
  var c=CATS.find(function(x){return x.k===catK});
  var rows=memberKeys(catK).filter(passFilter);
  var ss=sortState[catK]||{col:c.cols[0][0],dir:-1};
  rows.sort(function(a,b){return (sortVal(ss.col,a)-sortVal(ss.col,b))*ss.dir});
  var aoa=[[{t:'s',v:'重点词类别'},{t:'s',v:'关键词'},{t:'s',v:'日均搜索人数'},{t:'s',v:'平均支付率'},{t:'s',v:'日均GMV'}]];
  rows.forEach(function(k){var m=k._m;
    aoa.push([{t:'s',v:catK},{t:'s',v:k.n},{t:'n',v:Math.round(m.cur)},{t:'p',v:(m.pr/100).toFixed(6)},{t:'n',v:Math.round(m.gmv)}]);
  });
  var mmdd=function(i){return fmtMD(i).replace('/','');};
  var fname='重点词_'+catK+'_'+CUR_PLAT+'_'+mmdd(A-6)+'-'+mmdd(A)+'.xlsx';
  var bytes=buildXlsxBytes(catK,aoa);
  var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

document.getElementById('divs').innerHTML=DIVS.map(function(d){return '<button class="dbtn'+(d==='全部'?' on':'')+'" data-d="'+d+'">'+d+'</button>'}).join('');
document.querySelectorAll('.dbtn').forEach(function(el){el.onclick=function(){divFilter=el.dataset.d;document.querySelectorAll('.dbtn').forEach(function(x){x.classList.toggle('on',x.dataset.d===divFilter)});resetPages();render();};});
document.getElementById('search').addEventListener('input',function(e){searchTerm=e.target.value.trim();resetPages();render();});
document.getElementById('resetBtn').onclick=function(){T=JSON.parse(JSON.stringify(DEF));CATS.forEach(function(c){c.p.forEach(function(p){var r=document.getElementById('r_'+p[0]);r.max=p[4];r.value=T[p[0]];document.getElementById('v_'+p[0]).textContent=T[p[0]];document.getElementById('u_'+p[0]).textContent=p[2];updateModState(p[0]);})});syncLgPos();resetPages();render();};

// 周日均迷你图：自定义浮层提示（事件委托，兼容每次重渲染）
var tipEl=document.getElementById('tip');
document.addEventListener('mousemove',function(e){
  var t=e.target, txt=(t&&t.getAttribute)?t.getAttribute('data-t'):null;
  if(txt){ tipEl.textContent=txt; tipEl.style.left=e.clientX+'px'; tipEl.style.top=e.clientY+'px'; tipEl.style.opacity='1'; }
  else if(tipEl.style.opacity!=='0'){ tipEl.style.opacity='0'; }
});

var ctlCollapsed=true; // 阈值抽屉默认收起，词库满屏展开
var layoutEl=document.getElementById('layout');
function applyCtlCollapse(){
  layoutEl.classList.toggle('collapsed',ctlCollapsed);
  var tab=document.getElementById('ctlToggle');
  tab.querySelector('.arr').textContent=ctlCollapsed?'›':'‹';
  tab.querySelector('.lbl').textContent=ctlCollapsed?'展开阈值参数':'收起阈值参数';
}
document.getElementById('ctlToggle').onclick=function(){ ctlCollapsed=!ctlCollapsed; applyCtlCollapse(); };

buildControls(); applyCtlCollapse(); applyPlatform(CUR_PLAT); setA(NDAYS-1);
</script>
